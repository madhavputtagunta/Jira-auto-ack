{ 
 "name": "Build APK", 
 "on": { "push": {}, "workflow_dispatch": {} }, 
 "permissions": { "contents": "write" }, 
 "jobs": { 
 "build": { 
 "runs-on": "ubuntu-latest", 
 "steps": [ 
 { "uses": "actions/checkout@v4" }, 
 { "uses": "actions/setup-java@v4", "with": { "distribution": "temurin", "java-version": "17" } }, 
 { "name": "Build", "run": "unzip -q JiraAutoAck.zip && cd JiraAutoAck && chmod +x gradlew && ./gradlew --no-daemon assembleDebug" }, 
 { "name": "Publish APK", "env": { "GH_TOKEN": "${{ github.token }}" }, "run": "gh release create build-${{ github.run_number }} JiraAutoAck/app/build/outputs/apk/debug/app-debug.apk --title Build-${{ github.run_number }} --notes Debug-APK" } 
 ] 
 } 
 } 
}
